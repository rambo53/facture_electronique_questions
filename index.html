<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classification des Demandes Client</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>Classification des Demandes</h1>

    <form id="classificationForm">
        <div class="header-fields">
            <div class="form-group">
                <label for="clientName">Nom du client <span class="mandatory-fields">*</span></label>
                <input type="text" id="clientName" name="clientName" required placeholder="Ex: Entreprise Dupond">
            </div>
            <div class="form-group">
                <label for="collabName">Nom du collaborateur <span class="mandatory-fields">*</span></label>
                <input type="text" id="collabName" name="collabName" required placeholder="Ex: Jean Martin">
            </div>
            <div class="form-group">
                <label for="appointmentDate">Date du RDV <span class="mandatory-fields">*</span></label>
                <input type="date" id="appointmentDate" name="appointmentDate" required>
            </div>

			<div class="form-group">
				<label for="activitySector">Secteur d'activité du client</label>
				<select id="activitySector" name="activitySector">
				<!-- on injecte dynamiquement tous les secteurs -->
				</select>
			</div>
			<div class="form-group full-width">
                <label for="freeNotes">Notes libres</label>
                <textarea id="freeNotes" name="freeNotes" rows="3" placeholder="Saisissez vos remarques générales ici..."></textarea>
            </div>
			<div class="form-group full-width">
				<span class="mandatory-fields"> * Champs obligatoires</span>
			</div>
        </div>
		
		<template id="category-template">
			<div class="categ-div">
				<div class="category-header">
					<h2 class="category-title"></h2>
					<div class="radio-group">
						<span class="category-subtitle" style="margin-right: 10px; font-size: 0.9rem;"></span>
						
						<input type="radio" class="radio-oui" value="OUI">
						<label class="radio-label btn-oui">OUI</label>
						
						<input type="radio" class="radio-non" value="NON" checked>
						<label class="radio-label btn-non">NON</label>
					</div>
				</div>
				<div class="questions-container">
					
				</div>
			</div>
		</template>
		
		<template id="question-template">
			<div class="question-item">
				<div class="question-text">
					<span class="question-main"></span>
					<span class="question-comment"></span>
					<input type="text" class="question-remark" placeholder="Remarque libre pour la question..." disabled>
				</div>
				<div class="radio-group">
                    <input type="radio" id="" name="" class="q-radio-oui" value="OUI" disabled>
                    <label for="" class="radio-label q-label-oui">OUI</label>
                    <input type="radio" id="" name="" class="q-radio-non" value="NON" checked disabled>
                    <label for="" class="radio-label q-label-non">NON</label>
				</div>
			</div>
		</template>
		
		<div id="categories-container">
		
		</div>
		
		<!-- afficher par défaut tous les cas avec des regroupements par typologie, mettre en surbrillance si sélection secteur activité-->
        <div class="category-block disabled" id="cat-A">
            <div class="category-header">
                <h2>Catégorie A : Vente à l'étranger</h2> <!-- label catégorie, tiers payeur... -->
                <div class="radio-group">
                    <span style="margin-right: 10px; font-size: 0.9rem;">Faites-vous des ventes à l'étranger ?</span>
                    <input type="radio" id="catA-oui" name="catA_master" value="OUI" onchange="toggleCategory('A', true)">
                    <label for="catA-oui" class="radio-label">OUI</label>
                    
                    <input type="radio" id="catA-non" name="catA_master" value="NON" checked onchange="toggleCategory('A', false)">
                    <label for="catA-non" class="radio-label">NON</label>
                </div>
            </div>
            <div class="questions-container" id="questions-A">
                <div class="question-item">
                    <div class="question-text">
                        <span class="question-main">Question A1 : Faites-vous des ventes en Europe ?</span>
                        <span class="question-comment">* Concerne la zone Euro et hors-UE (Suisse, UK...)</span>
                        <input type="text" class="question-remark" name="remarque_A1" placeholder="Remarque libre pour la question A1..." disabled>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="qA1-oui" name="qA1" value="OUI" disabled>
                        <label for="qA1-oui" class="radio-label">OUI</label>
                        <input type="radio" id="qA1-non" name="qA1" value="NON" checked disabled>
                        <label for="qA1-non" class="radio-label">NON</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="submit-box">
            <button type="submit" class="btn-submit">Enregistrer la demande</button>
        </div>
    </form>
	
	<div id="template-pdf" class="hide">
	<p>test</p>
	</div>
	
</div>

</body>
</html>

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
></script>
