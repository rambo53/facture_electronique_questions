<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Dossier</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-container">
    <h2>Nouveau Dossier</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="nomDossier">Nom du dossier :</label>
            <input type="text" id="nomDossier" name="nomDossier" placeholder="Ex: Projet Alpha" required>
        </div>
        
        <div class="form-group">
            <label for="nomCollaborateur">Nom du collaborateur :</label>
            <input type="text" id="nomCollaborateur" name="nomCollaborateur" placeholder="Ex: FKV" required>
        </div>
		
		<div id="divOption" class="form-group hide">
			<label for="monChoix">Sélectionnez un secteur :</label>
			<select id="monChoix" name="monChoix" required>
			<!--  ici on affichera les options de secteur -->
			</select>
		</div>
		
		<div id="divTypologie" class="form-group hide">
			<label for="monChoixTypologie">Sélectionnez une typologie :</label>
			<select id="monChoixTypologie" name="monChoixTypologie">
			<!--  ici on affichera les options de secteur -->
			</select>
		</div>
		
		<div id="divCas" class="hide">
			<!--  ici on affichera la label du cas ainsi que la liste des questions à poser par le collaborateur -->
        </div>
		
        <button id="buttonValidation" class="hide" type="submit">Valider</button>
    </form>
</div>

</body>
</html>
<script src="data/data.js"></script>
<script src="js/global.js"></script>
